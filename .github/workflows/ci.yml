# Lint, test and build every push and pull request; a push to main then deploys
# (foodstorage-api docs/deployment.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  # Runs only once the server exists: repository variables DEPLOY_HOST (its IP) and
  # DEPLOY_KNOWN_HOST (its pinned ssh-ed25519 host key line), and the secret DEPLOY_SSH_KEY.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://usefirst.alexjohnsuarez.com
    # One deploy at a time per repo; the server also queues deploys from both repos.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The app is built here, not on the 512 MB server; the server only unpacks it.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: echo "${GITHUB_SHA::7}" > dist/version.txt
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOST: ${{ vars.DEPLOY_KNOWN_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          # The built app on stdin = deploy the web half (foodstorage-api deploy/deploy.sh).
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST"
